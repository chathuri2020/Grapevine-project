version: "3.8"

services:
  db:
    image: mysql:8.0
    container_name: grapevine-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: vitisai
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"

  web:
    build: .
    container_name: grapevine-web
    command: sh -c "python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    depends_on:
      - db
    env_file:
      - .env
    environment:
      - MYSQL_HOST=db
      - MYSQL_DATABASE=vitisai
      - MYSQL_USER=root
      - MYSQL_PASSWORD=root

volumes:
  mysql_data:
  static_volume:
  media_volume:
