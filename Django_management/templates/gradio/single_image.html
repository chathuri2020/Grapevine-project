{% extends 'base.html' %}
{% load static %}

{% block content %}
<input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}">
<div class="container">
    <div class="main-body">
        <div class="row">
            <div class="col-lg-4">
                <div class="card">
                    <div class="card-body">
                        <div class="card-header py-3">
                            <h6 class="m-0 font-weight-bold text-primary">Input Image</h6>
                        </div>
                        <div class="card-body">
                            <input type="file" class="form-control mb-3" id="img-input-single" accept="image/*">
                            <button class="btn btn-primary mt-3" id="run-single-btn">
                                Run Analysis
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-lg-8">
                <div class="card ">
                    <div class="card-header py-3 text-center">
                        <h6 class="m-0 font-weight-bold text-primary">Analysis Output</h6>
                    </div>
                    <div class="card-body ">

                        <div class="d-flex flex-column align-items-center text-center image-container"
                            style="min-height: 200px; ">
                            <img src="" class="p-1" id="img-output-single"
                                style="max-width: 100%; max-height: 350px; object-fit: contain; ">

                        </div>



                        <div id="metrics-output-single" class="mt-3 text-primary small text-center">
                            Select an image and click Run Analysis.
                        </div>
                        <p id="single-loading-text" class="text-info mt-5" style="display: none;"></p>


                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<link rel="stylesheet" href="{% static 'assets/css/models.css' %}">

<script src="{% static 'assets/js/gradio.js' %}"></script>

{% endblock content %}
